target-version = "py311"
line-length = 130

# Vendored third-party packages: not our code to lint.
exclude = [
    "doc/",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-native rules
    "S",    # security
]

ignore = [
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
